# The full test suite and the rock's smoke test, on every push and pull request.
# Linux is the reference; macOS runs too but may fail without blocking (it is newer to
# the suite: the runner and the tests pick GNU or BSD tools — timeout / gtimeout,
# stat -c / -f, script -qec / -q — through eval/tests/_harness.lua).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}${{ matrix.cjson && ', lua-cjson' || '' }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both JSON backends: the bundled dkjson (lua-cjson is optional) and lua-cjson.
          - os: ubuntu-24.04
            experimental: false
            cjson: false
          - os: ubuntu-24.04
            experimental: false
            cjson: true
          - os: macos-14
            experimental: true
            cjson: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8   # v5.0.0 (pinned by commit; Node 24)
        with:
          fetch-depth: 0   # the codebase-index and calibrate tests read git history

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            luajit luarocks libsqlite3-0 libsodium23 lua-socket lua-sec jq git universal-ctags
          git config --global user.email ci@example.invalid
          git config --global user.name CI

      - name: lua-cjson
        if: matrix.cjson
        run: sudo apt-get install -y --no-install-recommends lua-cjson

      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install luajit luarocks sqlite libsodium jq universal-ctags coreutils   # coreutils: gtimeout
          luarocks --lua-dir="$(brew --prefix luajit)" --lua-version 5.1 install luasocket
          echo "MEMO_LIB_SODIUM=$(brew --prefix libsodium)/lib/libsodium.dylib" >> "$GITHUB_ENV"
          echo "MEMO_LIB_SQLITE3=$(brew --prefix sqlite)/lib/libsqlite3.dylib" >> "$GITHUB_ENV"
          eval "$(luarocks --lua-dir="$(brew --prefix luajit)" --lua-version 5.1 path)"
          echo "LUA_PATH=$LUA_PATH" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$LUA_CPATH" >> "$GITHUB_ENV"
          git config --global user.email ci@example.invalid
          git config --global user.name CI

      - name: Versions
        run: |
          luajit -v
          luajit -e 'package.path="./?.lua;./?/init.lua;"..package.path
            print("SQLite", require("luamemo.native.sqlite").version())'

      - name: Test suite
        env:
          TMPDIR: ${{ runner.temp }}/t   # the run's logs, kept by run.lua when a file fails
        run: |
          mkdir -p "$TMPDIR"
          luajit eval/tests/run.lua --timeout 900

      # A failed run's per-file logs (test data only — run.lua prints no credential): the
      # job output shows the first lines of each failure, these hold the rest.
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6.0.0 (Node 24)
        with:
          name: test-logs-${{ matrix.os }}${{ matrix.cjson && '-cjson' || '' }}
          path: ${{ runner.temp }}/t/luamemo-tests.*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Rock smoke test
        if: ${{ !cancelled() }}   # (also after a failed suite: its own result is worth seeing)
        run: |
          v=$(luajit -e 'package.path="./?.lua;./?/init.lua;"..package.path io.write(require("luamemo").VERSION)')
          luajit eval/release/rockspec.lua "$v" --check
          bash eval/release/smoke.sh "luamemo-$v-1.rockspec"
