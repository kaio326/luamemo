# A release, by hand: Actions → Release → Run workflow, with the version (it must be
# luamemo.VERSION, with its rockspec and its CHANGELOG section already on the branch).
#   1. the checks, and the whole CI (tests + rock smoke test) on that commit;
#   2. the prebuilt GGUF runtime for Linux x86_64 and macOS arm64 (eval/release/gguf_bundle.sh);
#   3. the eval kit (eval/release/eval_kit.sh — the benchmark runners `memo eval install`
#      downloads); the release commit — the runtimes' checksums in
#      luamemo/embedders/native/bundles.lua, the kit's in luamemo/evalkit.lua, the
#      CHANGELOG date — which only the tag points to (the branch is left as it is), the
#      tag v<version>;
#   4. the source rock packed from that tag, smoke-tested exactly as it will be published;
#   5. the GitHub Release (rock, rockspec, runtimes, eval kit + checksums, notes from the
#      CHANGELOG);
#   6. with "publish", luarocks.org — needs the repository secret LUAROCKS_API_KEY.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z — luamemo.VERSION)"
        required: true
      publish:
        description: "Also upload the rock to luarocks.org"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8   # v5.0.0 (pinned by commit; Node 24)
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit
      - name: Version, rockspec, CHANGELOG, tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          have=$(luajit -e 'package.path="./?.lua;./?/init.lua;"..package.path io.write(require("luamemo").VERSION)')
          [[ "$have" == "$VERSION" ]] || { echo "::error::luamemo.VERSION is $have, not $VERSION"; exit 1; }
          luajit eval/release/rockspec.lua "$VERSION" --check
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [$VERSION] section"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION exists already"; exit 1; fi

  ci:
    needs: checks
    uses: ./.github/workflows/ci.yml

  gguf:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15]   # (macos-15 is arm64; GitHub retired macos-14 on 2026-11-02)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8   # v5.0.0 (pinned by commit; Node 24)
      - name: Build tools
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake luajit
          else
            brew install cmake luajit
          fi
      - name: Prebuilt runtime
        env:
          VERSION: ${{ inputs.version }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"   # (the runner is macOS 15; the runtime should still load on 14. Ignored on Linux)
        run: bash eval/release/gguf_bundle.sh "$VERSION" dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6.0.0 (Node 24)
        with:
          name: gguf-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [ci, gguf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8   # v5.0.0 (pinned by commit; Node 24)
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          # lua-dkjson: `luarocks upload` needs a JSON library (0.5.1's upload failed without one)
          sudo apt-get install -y --no-install-recommends luajit luarocks libsqlite3-0 libsodium23 lua-socket jq git lua-dkjson
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7.0.0 (Node 24)
        with:
          pattern: gguf-*
          path: dist
          merge-multiple: true

      - name: Release commit (only the tag points to it) and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          luajit eval/release/write_bundles.lua "$VERSION" dist
          # (its own directory: write_bundles reads every dist/*.sha256 as a runtime's)
          bash eval/release/eval_kit.sh "$VERSION" kit
          luajit eval/release/write_evalkit.lua "$VERSION" kit
          sed -i "s/^## \[$VERSION\] — unreleased/## [$VERSION] — $(date -u +%Y-%m-%d)/" CHANGELOG.md
          git add luamemo/embedders/native/bundles.lua luamemo/evalkit.lua CHANGELOG.md
          git commit -m "release: v$VERSION (prebuilt GGUF runtime and eval kit checksums, CHANGELOG date)"
          git tag -a "v$VERSION" -m "luamemo $VERSION"
          git push origin "v$VERSION"

      - name: Source rock, from the tag
        run: |
          luarocks pack "luamemo-$VERSION-1.rockspec"
          ls -l "luamemo-$VERSION-1.src.rock"

      - name: Smoke test of that rock
        run: bash eval/release/smoke.sh "luamemo-$VERSION-1.src.rock"

      - name: GitHub Release
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "luamemo $VERSION" --notes-file notes.md --verify-tag \
            "luamemo-$VERSION-1.src.rock" "luamemo-$VERSION-1.rockspec" dist/*.tar.gz dist/*.sha256 \
            kit/*.tar.gz kit/*.sha256

      - name: luarocks.org
        if: inputs.publish
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          [[ -n "$LUAROCKS_API_KEY" ]] || { echo "::error::the repository secret LUAROCKS_API_KEY is not set"; exit 1; }
          # Uploads the rockspec and the source rock it packs from the tag (as above).
          luarocks upload "luamemo-$VERSION-1.rockspec" --api-key="$LUAROCKS_API_KEY"

      # luarocks.org takes the module's summary and description from the FIRST rockspec uploaded and never updates them
      # from a later one, and the site has no API for it (an API key reaches only the upload endpoints; the edit form needs
      # a login session and a CSRF token). So this only CHECKS: when the page's summary differs from the rockspec's, it
      # warns and puts the text to paste, and the edit link, into the job summary. It never fails the release.
      - name: luarocks.org module text (check only)
        if: inputs.publish
        continue-on-error: true
        env:
          LUAROCKS_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p lrtext
          luajit eval/release/luarocks_text.lua "luamemo-$VERSION-1.rockspec" lrtext
          url="https://luarocks.org/modules/$LUAROCKS_USER/luamemo"
          page=$(curl -fsS --max-time 30 "$url") || { echo "::warning::could not read $url — check the module text by hand"; exit 0; }
          decode() { sed -e 's/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g' -e "s/&#39;/'/g"; }
          live=$(printf '%s' "$page" | grep -o '<p class="module_summary">[^<]*</p>' | head -1 | sed -e 's/<[^>]*>//g' | decode)
          if [[ "$live" == "$(cat lrtext/summary.txt)" ]]; then
            echo "the module summary on luarocks.org matches the rockspec"
            exit 0
          fi
          echo "::warning::the luarocks.org module text differs from the rockspec — edit it at https://luarocks.org/edit/modules/$LUAROCKS_USER/luamemo (text in the job summary)"
          {
            echo "### luarocks.org module text is out of date"
            echo
            echo "Edit it at https://luarocks.org/edit/modules/$LUAROCKS_USER/luamemo (an upload never updates it)."
            echo
            echo "Live summary: \`$live\`"
            echo
            echo "**Summary** ($(wc -c < lrtext/summary.txt) bytes; the site's limit is 512 characters):"
            echo '```'
            cat lrtext/summary.txt
            echo
            echo '```'
            echo
            echo "**Description** ($(wc -c < lrtext/description.txt) bytes; the site's limit is 5120 characters):"
            echo '```'
            cat lrtext/description.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
